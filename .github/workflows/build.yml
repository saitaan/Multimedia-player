name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          validate-wrappers: false

      - name: Prepare Project & Build APK
        run: |
          echo "=== Step 1: Checking files in repository ==="
          ls -la

          # If zip file is uploaded, extract it automatically
          ZIP_FILES=$(find . -maxdepth 2 -name "*.zip")
          if [ -n "$ZIP_FILES" ]; then
            for z in $ZIP_FILES; do
              echo "Extracting $z..."
              unzip -q -o "$z"
            done
          fi

          # Find settings.gradle or build.gradle
          SETTINGS_FILE=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Project files not found! Please upload multimedia-player.zip to this repository."
            echo "Current files in repo:"
            find . -maxdepth 3
            exit 1
          fi

          TARGET_DIR=$(dirname "$SETTINGS_FILE")
          echo "Moving to project directory: $TARGET_DIR"
          cd "$TARGET_DIR"

          # Setup wrapper if needed
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x ./gradlew
          
          echo "=== Step 2: Running Gradle Build ==="
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Multimedia-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn
          retention-days: 14
